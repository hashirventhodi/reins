# Merge-time telemetry extraction (blueprint §10, path 1).
# Runs only deterministic core commands; the runtime performs git, the
# product projects metrics. Idempotency key (task, outcome) makes re-runs
# safe. Telemetry stays in the consuming repo's own telemetry.jsonl —
# nothing leaves it.
name: pipeline-telemetry
on:
  pull_request:
    types: [closed]
jobs:
  extract:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ github.event.pull_request.head.sha }}', fetch-depth: 0}
      # Zero-install core (D30): clone and invoke by path — nothing is
      # pip-installed. Pin a tag/sha in place of main for reproducibility,
      # or point REINS_HOME at a vendored checkout instead.
      - run: git clone --depth 1 https://github.com/hashirventhodi/reins "$RUNNER_TEMP/reins"
      - name: record merge + extract
        run: |
          TASK=$(basename "$(ls -d .dev/tasks/*/ | head -1)")   # or derive from branch name
          python3 "$RUNNER_TEMP/reins/pipeline_cli.py" decide merged "$TASK" --commit "${{ github.event.pull_request.merge_commit_sha }}"
          python3 "$RUNNER_TEMP/reins/pipeline_cli.py" extract "$TASK" --append
      - name: push telemetry to main
        run: |
          git checkout ${{ github.event.pull_request.base.ref }} -- . || true
          git checkout ${{ github.event.pull_request.base.ref }}
          git pull
          # bring the appended record over and commit
          git checkout ${{ github.event.pull_request.head.sha }} -- telemetry.jsonl || true
          git config user.name pipeline-bot && git config user.email bot@pipeline
          git add telemetry.jsonl && git commit -m "telemetry: $TASK" && git push
